<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots2" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="rgba(255,255,255,0.03)"/>
    </pattern>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(167,139,250,0.5)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0.1)"/>
    </linearGradient>
  </defs>

  <rect width="700" height="300" fill="#060d1a"/>
  <rect width="700" height="300" fill="url(#dots2)"/>

  <!-- Title -->
  <text x="20" y="24" font-family="monospace" font-size="9" fill="#1e2d44" letter-spacing="2">AI FEEDBACK LOOP · INTERVIEW GYM · FLOW MAP</text>
  <line x1="20" y1="30" x2="680" y2="30" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Stage nodes in a horizontal loop -->
  <!-- Stage 1: Practice Answer -->
  <rect x="30" y="105" width="120" height="56" rx="7" fill="#0a1424" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <text x="90" y="127" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa" letter-spacing="1">STAGE 1</text>
  <text x="90" y="143" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Practice</text>
  <text x="90" y="155" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Answer</text>

  <!-- Arrow 1→2 -->
  <line x1="150" y1="133" x2="194" y2="133" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <polygon points="194,133 187,129 187,137" fill="rgba(167,139,250,0.6)"/>

  <!-- Stage 2: AI Analysis -->
  <rect x="194" y="105" width="120" height="56" rx="7" fill="#0d1020" stroke="rgba(34,211,238,0.5)" stroke-width="1.5"/>
  <rect x="197" y="108" width="114" height="50" rx="5" fill="rgba(34,211,238,0.03)"/>
  <text x="254" y="127" text-anchor="middle" font-family="monospace" font-size="8" fill="#22d3ee" letter-spacing="1">HIRO</text>
  <text x="254" y="143" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">AI</text>
  <text x="254" y="155" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Analysis</text>

  <!-- Arrow 2→3 -->
  <line x1="314" y1="133" x2="358" y2="133" stroke="rgba(34,211,238,0.4)" stroke-width="1.5"/>
  <polygon points="358,133 351,129 351,137" fill="rgba(34,211,238,0.6)"/>

  <!-- Stage 3: Structured Metrics -->
  <rect x="358" y="105" width="120" height="56" rx="7" fill="#0a1424" stroke="rgba(74,123,247,0.4)" stroke-width="1.5"/>
  <text x="418" y="127" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a7bf7" letter-spacing="1">STAGE 3</text>
  <text x="418" y="143" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Structured</text>
  <text x="418" y="155" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Metrics</text>

  <!-- Arrow 3→4 -->
  <line x1="478" y1="133" x2="522" y2="133" stroke="rgba(74,123,247,0.4)" stroke-width="1.5"/>
  <polygon points="522,133 515,129 515,137" fill="rgba(74,123,247,0.6)"/>

  <!-- Stage 4: Action Plan -->
  <rect x="522" y="105" width="148" height="56" rx="7" fill="#0a1424" stroke="rgba(249,115,98,0.4)" stroke-width="1.5"/>
  <text x="596" y="127" text-anchor="middle" font-family="monospace" font-size="8" fill="#f97362" letter-spacing="1">STAGE 4</text>
  <text x="596" y="143" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Action Plan</text>
  <text x="596" y="155" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">+ Retry</text>

  <!-- Return loop arrow (bottom) -->
  <path d="M 596 161 L 596 220 L 90 220 L 90 161" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="90,161 86,168 94,168" fill="rgba(255,255,255,0.12)"/>
  <text x="350" y="240" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3350" letter-spacing="1">retry loop · avg 2.3 attempts per session</text>

  <!-- Floating metric chips -->
  <rect x="194" y="60" width="80" height="22" rx="4" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="234" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee">STAR: 2/4</text>

  <rect x="290" y="60" width="80" height="22" rx="4" fill="rgba(74,123,247,0.08)" stroke="rgba(74,123,247,0.2)" stroke-width="1"/>
  <text x="330" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a7bf7">WPM: 187</text>

  <rect x="386" y="60" width="90" height="22" rx="4" fill="rgba(249,115,98,0.08)" stroke="rgba(249,115,98,0.2)" stroke-width="1"/>
  <text x="431" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97362">fillers: 9</text>

  <rect x="492" y="60" width="100" height="22" rx="4" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="542" y="75" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">examples: 1/4</text>

  <!-- Connector lines from metrics to stage 2 -->
  <line x1="234" y1="82" x2="234" y2="105" stroke="rgba(34,211,238,0.15)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="330" y1="82" x2="330" y2="105" stroke="rgba(74,123,247,0.15)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Bottom label -->
  <text x="20" y="282" font-family="monospace" font-size="8" fill="#1a2d40" letter-spacing="1">$ ai_integration.ai · feedback_loop_v3 · avg_latency: 2.8s</text>
</svg>
