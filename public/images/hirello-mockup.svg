  <rect x="30" y="96" width="360" height="44" rx="5" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="50" cy="118" r="12" fill="#1a2840" stroke="rgba(74,123,247,0.3)" stroke-width="1"/>
