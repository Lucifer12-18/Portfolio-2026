  <rect x="30" y="148" width="360" height="44" rx="5" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="50" cy="170" r="12" fill="#1a2840" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="50" y="174" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#a78bfa" font-weight="600">SR</text>
  <text x="70" y="165" font-family="-apple-system,sans-serif" font-size="11" fill="#e2e8f0" font-weight="500">Sarah R.</text>
