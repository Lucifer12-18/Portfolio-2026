  <text x="440" y="175" font-family="-apple-system,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700">2/4</text>
  <text x="440" y="187" font-family="monospace" font-size="8" fill="#1e3350">S ✓  T ✗  A ✓  R ✗</text>

