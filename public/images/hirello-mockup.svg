  <rect x="730" y="142" width="90" height="52" rx="5" fill="#0d1629" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="740" y="158" font-family="monospace" font-size="8" fill="#334155" letter-spacing="1">FILLERS</text>
  <text x="740" y="175" font-family="-apple-system,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700">9</text>
  <text x="740" y="187" font-family="monospace" font-size="8" fill="#1e3350">um, like, so</text>

  <!-- Answer transcript preview -->
  <rect x="430" y="205" width="390" height="80" rx="5" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="440" y="220" font-family="monospace" font-size="8" fill="#1e3350" letter-spacing="1">ANSWER TRANSCRIPT</text>
  <line x1="430" y1="226" x2="820" y2="226" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="440" y="242" font-family="-apple-system,sans-serif" font-size="10" fill="#334155" font-style="italic">&quot;In my last role, I um, worked on a design project where... like... I had to coordinate</text>
  <text x="440" y="256" font-family="-apple-system,sans-serif" font-size="10" fill="#334155" font-style="italic">with a team. So the outcome was, I think, pretty good. People were happy with it.&quot;</text>
  <!-- Highlighted problem words -->
  <rect x="472" y="237" width="18" height="11" rx="2" fill="rgba(249,115,98,0.2)" stroke="rgba(249,115,98,0.3)" stroke-width="0.5"/>
  <rect x="521" y="237" width="16" height="11" rx="2" fill="rgba(249,115,98,0.2)" stroke="rgba(249,115,98,0.3)" stroke-width="0.5"/>

  <!-- Retry button -->
  <rect x="430" y="296" width="130" height="32" rx="6" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.35)" stroke-width="1"/>
  <text x="495" y="316" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#a78bfa" font-weight="500">Try again → fix examples</text>
