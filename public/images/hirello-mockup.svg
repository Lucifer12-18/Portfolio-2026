  <text x="540" y="158" font-family="monospace" font-size="8" fill="#334155" letter-spacing="1">EXAMPLES</text>
  <text x="540" y="175" font-family="-apple-system,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700">1/4</text>
  <text x="540" y="187" font-family="monospace" font-size="8" fill="#1e3350">expected: 3–4</text>

  <!-- WPM -->
  <rect x="630" y="142" width="90" height="52" rx="5" fill="#0d1629" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="640" y="158" font-family="monospace" font-size="8" fill="#334155" letter-spacing="1">PACING</text>
  <text x="640" y="175" font-family="-apple-system,sans-serif" font-size="16" fill="#f97362" font-weight="700">187</text>
  <text x="640" y="187" font-family="monospace" font-size="8" fill="#1e3350">target: 130–160</text>

