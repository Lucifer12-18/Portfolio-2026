<svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="220" fill="#060d1a"/>

  <!-- Left column: emotional -->
  <rect x="20" y="20" width="268" height="180" rx="6" fill="rgba(249,115,98,0.04)" stroke="rgba(249,115,98,0.15)" stroke-width="1"/>
  <rect x="20" y="20" width="268" height="2" rx="1" fill="rgba(249,115,98,0.35)"/>

  <text x="154" y="48" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(249,115,98,0.7)">&quot;Your answer felt weak&quot;</text>
  <text x="154" y="64" text-anchor="middle" font-family="monospace" font-size="8" fill="#2d3a4d">emotional framing</text>

  <!-- User reaction: closed off -->
  <text x="154" y="108" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="32" fill="#1e2d44">🤐</text>
  <text x="154" y="135" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#334155">silence</text>
  <text x="154" y="149" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#2d3a4d">defensiveness</text>
  <text x="154" y="163" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#1e2d44">writes nothing down</text>

  <!-- Divider -->
  <line x1="300" y1="10" x2="300" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Right column: measurable -->
  <rect x="312" y="20" width="268" height="180" rx="6" fill="rgba(34,211,238,0.04)" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <rect x="312" y="20" width="268" height="2" rx="1" fill="rgba(34,211,238,0.5)"/>

  <text x="446" y="48" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(34,211,238,0.8)">&quot;1 of 4 examples expected&quot;</text>
  <text x="446" y="64" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e4a5c">measurable framing</text>

  <!-- User reaction: engaged -->
  <text x="446" y="108" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="32" fill="#164e63">📓</text>
  <text x="446" y="135" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#22d3ee">opens notes app</text>
  <text x="446" y="149" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#1e6878">asks follow-ups</text>
  <text x="446" y="163" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#164e63">retries the answer</text>

  <!-- Bottom -->
  <text x="300" y="208" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e2d44" letter-spacing="1">SAME OBSERVATION · DIFFERENT FRAMING · DIFFERENT OUTCOME</text>
</svg>
