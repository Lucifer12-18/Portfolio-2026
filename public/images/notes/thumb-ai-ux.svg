<svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(74,123,247,0.12)"/>
      <stop offset="100%" stop-color="rgba(74,123,247,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="600" height="220" fill="#060d1a"/>
  <rect width="600" height="220" fill="url(#tg1)"/>

  <!-- Left side: overwhelming signals (before) -->
  <!-- Many small dots -->
  <circle cx="60" cy="60" r="3" fill="rgba(74,123,247,0.2)"/>
  <circle cx="85" cy="45" r="2.5" fill="rgba(74,123,247,0.15)"/>
  <circle cx="40" cy="80" r="2" fill="rgba(74,123,247,0.12)"/>
  <circle cx="100" cy="75" r="3" fill="rgba(74,123,247,0.18)"/>
  <circle cx="55" cy="110" r="2.5" fill="rgba(74,123,247,0.1)"/>
  <circle cx="80" cy="130" r="2" fill="rgba(74,123,247,0.15)"/>
  <circle cx="110" cy="50" r="2" fill="rgba(74,123,247,0.1)"/>
  <circle cx="35" cy="130" r="3" fill="rgba(74,123,247,0.12)"/>
  <circle cx="120" cy="105" r="2.5" fill="rgba(74,123,247,0.15)"/>
  <circle cx="70" cy="150" r="2" fill="rgba(74,123,247,0.1)"/>
  <circle cx="95" cy="165" r="3" fill="rgba(74,123,247,0.12)"/>
  <circle cx="45" cy="160" r="2.5" fill="rgba(74,123,247,0.08)"/>
  <circle cx="115" cy="145" r="2" fill="rgba(74,123,247,0.1)"/>
  <circle cx="75" cy="95" r="2.5" fill="rgba(74,123,247,0.14)"/>
  <!-- connecting lines -->
  <line x1="60" y1="60" x2="85" y2="45" stroke="rgba(74,123,247,0.1)" stroke-width="0.8"/>
  <line x1="85" y1="45" x2="100" y2="75" stroke="rgba(74,123,247,0.08)" stroke-width="0.8"/>
  <line x1="60" y1="60" x2="55" y2="110" stroke="rgba(74,123,247,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="130" x2="95" y2="165" stroke="rgba(74,123,247,0.08)" stroke-width="0.8"/>
  <line x1="35" y1="130" x2="70" y2="150" stroke="rgba(74,123,247,0.06)" stroke-width="0.8"/>
  <!-- BEFORE label -->
  <text x="75" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e3350" letter-spacing="2">BEFORE</text>

  <!-- Center arrow -->
  <text x="185" y="115" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="28" fill="#1e2d44">→</text>

  <!-- Right side: single clear signal (after) -->
  <!-- One large glowing dot -->
  <circle cx="440" cy="100" r="32" fill="rgba(74,123,247,0.06)" stroke="rgba(74,123,247,0.15)" stroke-width="1"/>
  <circle cx="440" cy="100" r="20" fill="rgba(74,123,247,0.1)" stroke="rgba(74,123,247,0.3)" stroke-width="1.5"/>
  <circle cx="440" cy="100" r="9" fill="rgba(74,123,247,0.5)"/>
  <circle cx="440" cy="100" r="5" fill="#4a7bf7"/>
  <!-- signal label -->
  <text x="440" y="148" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#4a7bf7">one signal</text>

  <!-- 2 dimmed dots below -->
  <circle cx="412" cy="162" r="5" fill="transparent" stroke="rgba(74,123,247,0.2)" stroke-width="1.5"/>
  <circle cx="428" cy="162" r="5" fill="transparent" stroke="rgba(74,123,247,0.12)" stroke-width="1.5"/>
  <text x="450" y="166" font-family="monospace" font-size="8" fill="#1e3350">2 more</text>

  <!-- AFTER label -->
  <text x="440" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e3a6b" letter-spacing="2">AFTER</text>

  <!-- Top accent line -->
  <rect x="0" y="0" width="600" height="2" rx="1" fill="rgba(74,123,247,0.4)"/>
</svg>
